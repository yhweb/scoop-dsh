name: Bucket Guard

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'bucket/**'
      - 'scripts/scoop-bucket-guard.ps1'
      - '.github/workflows/guard.yml'
  schedule:
    # every 6 hours, offset from the excavator (which runs at */4)
    - cron: '45 */6 * * *'

permissions:
  contents: read

jobs:
  guard:
    name: Guard
    runs-on: windows-latest
    steps:
      - name: Checkout bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: my_bucket
      - name: Checkout scoop core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Run bucket guard
        shell: pwsh
        env:
          SCOOP_HOME: ${{ github.workspace }}\scoop_core
        run: |
          ./my_bucket/scripts/scoop-bucket-guard.ps1 -BucketDir ./my_bucket/bucket -FormOnly
